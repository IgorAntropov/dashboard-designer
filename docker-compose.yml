services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: panelka
      POSTGRES_PASSWORD: panelka
      POSTGRES_DB: panelka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      PANELKA_DATABASE_URL: postgresql+asyncpg://panelka:panelka@postgres:5432/panelka
      PANELKA_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

volumes:
  pgdata:
